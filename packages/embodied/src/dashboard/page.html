<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-embodied</title>
<style>
:root { --bg: #fafaf9; --panel: #fff; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #2563eb; --ok: #15803d; --bad: #b91c1c; --warn: #b45309; --code: #f5f5f4; }
@media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --panel: #1c1917; --fg: #e7e5e4; --muted: #a8a29e; --line: #292524; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --code: #292524; } }
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 14px; margin: 0; }
.meta { color: var(--muted); }
.grow { flex: 1; }
.badge { padding: 1px 8px; border-radius: 10px; border: 1px solid currentColor; font-size: 12px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .run { color: var(--accent); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(60vh, auto); } body { height: auto; } }
.col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.title { display: flex; gap: 10px; align-items: center; padding: 6px 12px; font-weight: 600; border-bottom: 1px solid var(--line); background: var(--panel); }
.title label { font-weight: 400; color: var(--muted); }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px; }
.ev { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
.ev.user { border-left: 3px solid var(--accent); padding-left: 8px; }
.ev.user::before { content: attr(data-who); display: block; font-size: 11px; color: var(--muted); }
.ev.thinking { color: var(--muted); font-style: italic; }
.ev.thinking summary { font-style: normal; cursor: pointer; }
.ev.meta { color: var(--muted); font-size: 12px; }
.ev.tool_call, .ev.tool_result { font-family: ui-monospace, monospace; font-size: 12px; }
.ev.tool_call { color: var(--accent); }
.ev.tool_result { cursor: pointer; }
.ev.tool_result.err { color: var(--bad); }
pre { margin: 4px 0; padding: 6px; background: var(--code); border-radius: 4px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
form, .composer { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
textarea { flex: 1; min-width: 200px; resize: vertical; font: inherit; padding: 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
input { font: inherit; padding: 4px 6px; width: 90px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.status { width: 100%; font-size: 12px; color: var(--muted); }
.camera { display: flex; flex-direction: column; min-height: 0; flex: 0 0 55%; border-bottom: 1px solid var(--line); }
.frames { flex: 1; min-height: 0; display: flex; gap: 6px; padding: 6px; justify-content: center; align-items: center; }
.frames a { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; }
.frames img { max-width: 100%; max-height: calc(100% - 18px); object-fit: contain; background: #000; }
.frames span { font-size: 11px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.m { font-family: ui-monospace, monospace; word-break: break-word; }
tr.step { cursor: pointer; }
tr.step.sel { background: var(--code); }
.empty { color: var(--muted); padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>pi-embodied · <span data-t="monitor"></span></h1>
  <span id="state" class="badge"></span>
  <span id="result" class="badge" hidden></span>
  <span id="model" class="badge"></span>
  <span id="task" class="meta"></span>
  <span id="lang"></span>
  <span class="grow"></span>
  <span id="usage" class="meta"></span>
  <span id="conn" class="meta"></span>
</header>
<main>
  <div class="col">
    <div class="title"><span data-t="reasoning"></span><span class="grow"></span>
      <label><input type="checkbox" id="expand" style="width:auto" /> <span data-t="expand"></span></label>
      <label><input type="checkbox" id="follow" style="width:auto" checked /> <span data-t="autoscroll"></span></label>
    </div>
    <div id="transcript" class="scroll"><div class="empty" data-t="noEvents"></div></div>
    <div class="composer">
      <textarea id="msg" rows="2"></textarea>
      <button id="send" class="primary" data-t="send"></button>
      <button id="stop" data-t="interrupt"></button>
      <div class="status" id="msgStatus"></div>
    </div>
    <form id="newTask">
      <b data-t="newTask"></b>
      <span id="taskFields"></span>
      <button class="primary" data-t="start"></button>
      <div class="status" id="taskStatus"></div>
    </form>
  </div>
  <div class="col" style="border-right:0">
    <div class="camera">
      <div class="title"><span data-t="camera"></span><span id="caption" class="meta" style="font-weight:400"></span><span class="grow"></span>
        <label><input type="checkbox" id="live" style="width:auto" checked /> <span data-t="followLatest"></span></label>
      </div>
      <div class="frames" id="frames"><div class="empty" data-t="noFrame"></div></div>
    </div>
    <div class="title"><span data-t="timeline"></span><span id="stepCount" class="meta"></span></div>
    <div class="scroll" style="padding:0"><table><tbody id="timeline"></tbody></table><div class="empty" id="noSteps" data-t="noActions"></div></div>
  </div>
</main>
<script>
const COPY = {
  en: {
    monitor: "Live Monitor", reasoning: "Agent reasoning & tool calls", expand: "expand tool calls", autoscroll: "auto-scroll",
    noEvents: "No transcript events yet.", send: "Send", interrupt: "Interrupt", newTask: "New task",
    start: "Start", camera: "Camera", followLatest: "follow latest",
    noFrame: "waiting for first frame…", timeline: "Action timeline", noActions: "No actions yet.",
    placeholder: "Message the agent… (Enter send · Shift+Enter newline · Esc interrupt · /robot-task …)",
    states: { idle: "idle", running: "running", detached: "switching", succeeded: "succeeded", finished: "finished" },
    solved: "TASK SOLVED", notSolved: "not solved", claimed: (s) => `claimed ${s}`,
    you: "You", thinking: (n) => `thinking · ${n.toLocaleString()} chars`, live: "● live", reconnecting: "○ reconnecting…",
    usage: (u) => `in ${u.input.toLocaleString()} · out ${u.output.toLocaleString()} · ${u.tools} tools`,
    envStep: (n) => `step ${n}`,
    confirmSwitch: "The agent is running. Abort this episode and start the new task?",
    sent: "Sent.", steered: "Queued: delivered after the current tool call.", interrupted: "Interrupt requested.",
    taskSent: "Starting a new session…", failed: (e) => `Failed: ${e}`, stepCaption: (s) => `#${s.n} ${s.name}`,
  },
  "zh-cn": {
    monitor: "实时监控", reasoning: "智能体推理与工具调用", expand: "展开工具调用", autoscroll: "自动滚动",
    noEvents: "暂无推理记录。", send: "发送", interrupt: "中断", newTask: "新任务",
    start: "开始", camera: "相机画面", followLatest: "跟随最新",
    noFrame: "等待第一帧…", timeline: "动作时间线", noActions: "暂无动作。",
    placeholder: "向智能体发送消息…(Enter 发送 · Shift+Enter 换行 · Esc 中断 · /robot-task …)",
    states: { idle: "空闲", running: "运行中", detached: "切换中", succeeded: "执行成功", finished: "已完成" },
    solved: "任务完成", notSolved: "未完成", claimed: (s) => `智能体声明 ${s}`,
    you: "你", thinking: (n) => `思考 · ${n.toLocaleString()} 字符`, live: "● 实时", reconnecting: "○ 正在重连…",
    usage: (u) => `输入 ${u.input.toLocaleString()} · 输出 ${u.output.toLocaleString()} · ${u.tools} 次工具调用`,
    envStep: (n) => `步 ${n}`,
    confirmSwitch: "智能体正在运行。中止当前回合并开始新任务?",
    sent: "已发送。", steered: "已排队:当前工具调用结束后送达。", interrupted: "已请求中断。",
    taskSent: "正在新建会话…", failed: (e) => `失败:${e}`, stepCaption: (s) => `#${s.n} ${s.name}`,
  },
};
const T = COPY[document.documentElement.lang === "zh-cn" ? "zh-cn" : "en"];
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const short = (v, n = 160) => { const s = typeof v === "string" ? v : JSON.stringify(v); return s && s.length > n ? s.slice(0, n) + "…" : s ?? ""; };
for (const e of document.querySelectorAll("[data-t]")) e.textContent = T[e.dataset.t];
$("msg").placeholder = T.placeholder;

let episode = null, steps = [], selected = null, tab = 0;
const nodes = new Map();

function renderItem(item) {
  const div = el("div", `ev ${item.kind}`);
  if (item.kind === "user") { div.dataset.who = T.you; div.append(item.text); }
  else if (item.kind === "thinking") {
    const d = el("details"); d.open = true;
    d.append(el("summary", "", T.thinking(item.text.length)), el("div", "", item.text));
    div.append(d);
  } else if (item.kind === "tool_call") {
    div.append(`→ ${item.name}(${short(item.args)})`);
    const pre = el("pre", "args", JSON.stringify(item.args, null, 2)); pre.hidden = !$("expand").checked; div.append(pre);
  } else if (item.kind === "tool_result") {
    if (item.isError) div.classList.add("err");
    div.append(`← ${item.name}: ${short(item.text)}`);
    const pre = el("pre", "args", item.text); pre.hidden = !$("expand").checked; div.append(pre);
    div.onclick = () => select(item.step, true);
  } else div.append(item.text);
  return div;
}
function putItem(item) {
  const old = nodes.get(item.id), div = renderItem(item);
  div._item = item;
  if (old) old.replaceWith(div); else { $("transcript").querySelector(".empty")?.remove(); $("transcript").append(div); }
  nodes.set(item.id, div);
  scroll();
}
function appendText(id, text) {
  const div = nodes.get(id); if (!div) return;
  div._item.text += text;
  if (div._item.kind === "thinking") {
    div.querySelector("details > div").append(text);
    div.querySelector("summary").textContent = T.thinking(div._item.text.length);
  } else div.append(text);
  scroll();
}
function scroll() { if ($("follow").checked) $("transcript").scrollTop = $("transcript").scrollHeight; }

function putStep(s) {
  steps[s.n] = s;
  $("noSteps").hidden = true;
  const tr = el("tr", "step");
  const flags = [s.solved ? "✓ solved" : "", s.isError ? "error" : ""].filter(Boolean).join(" ");
  const summary = el("td", "m");
  summary.append(el("b", "", s.name), ` ${short(s.args, 120)}`, el("br"), el("span", s.isError ? "bad" : "meta", `→ ${short(s.result, 200)}`));
  const full = el("pre", "", `args ${JSON.stringify(s.args, null, 2)}\nresult ${JSON.stringify(s.result, null, 2)}`); full.hidden = true;
  summary.append(full);
  tr.append(el("td", "", `#${s.n}`), summary,
    el("td", "meta", [s.envStep === null ? "" : T.envStep(s.envStep), s.ms === null ? "" : `${(s.ms / 1000).toFixed(1)}s`].filter(Boolean).join(" · ")),
    el("td", s.solved ? "ok" : s.isError ? "bad" : "", flags));
  tr.onclick = () => { full.hidden = !full.hidden; if (s.frames.length) select(s.n, true); };
  tr.id = `step-${s.n}`;
  $("timeline").append(tr);
  $("stepCount").textContent = `${steps.length}`;
  if ($("live").checked && s.frames.length) select(s.n, false);
}
function select(n, pin) {
  const s = steps[n]; if (!s || !s.frames.length) return;
  if (pin) $("live").checked = false;
  document.querySelector("tr.sel")?.classList.remove("sel");
  $(`step-${n}`)?.classList.add("sel");
  selected = n;
  $("caption").textContent = `${T.stepCaption(s)}${s.envStep === null ? "" : " · " + T.envStep(s.envStep)}`;
  const box = $("frames"); box.replaceChildren();
  s.frames.forEach((label, k) => {
    const a = el("a"); a.href = `/frame/${episode.gen}/${n}/${k}`; a.target = "_blank";
    const img = el("img"); img.src = `${a.href}?w=512`; img.alt = label;
    a.append(img, el("span", "", label)); box.append(a);
  });
}

/** One input per task field of the robot, filled with the current episode's values once. */
function renderTaskFields(e) {
  const box = $("taskFields");
  if (box.dataset.fields === e.fields.join(" ")) return;
  box.dataset.fields = e.fields.join(" ");
  box.replaceChildren(...e.fields.map((k) => {
    const input = el("input"); input.name = k; input.placeholder = k; input.required = true; input.value = e.task[k] ?? "";
    return input;
  }));
}

function renderEpisode() {
  const e = episode; if (!e) return;
  const ended = e.solved || e.ended || e.claimed;
  const state = e.running ? "running" : !e.attached ? "detached" : e.solved ? "succeeded" : ended ? "finished" : "idle";
  $("state").textContent = T.states[state];
  $("state").className = "badge " + ({ running: "run", succeeded: "ok", finished: "warn" }[state] ?? "meta");
  const r = $("result");
  r.hidden = !ended;
  if (ended) {
    const parts = [e.solved ? T.solved : T.notSolved];
    if (e.claimed) parts.push(T.claimed(e.claimed));
    r.textContent = parts.join(" · ");
    r.className = "badge " + (e.solved ? "ok" : "bad");
    r.title = e.summary ?? "";
  }
  $("task").textContent = [e.robot, ...e.fields.map((k) => `${k} ${e.task[k]}`)].join(" · ") + (e.envStep === null ? "" : ` · ${T.envStep(e.envStep)}`);
  $("model").textContent = e.model ?? "";
  $("lang").textContent = e.language ? `“${e.language}”` : "";
  $("usage").textContent = T.usage(e.usage);
  renderTaskFields(e);
}

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { $("conn").textContent = T.live; };
  es.onerror = () => { $("conn").textContent = T.reconnecting; };
  es.onmessage = (m) => {
    const op = JSON.parse(m.data);
    if (op.op === "reset") {
      episode = op.episode; steps = []; selected = null; nodes.clear();
      $("transcript").replaceChildren(); $("timeline").replaceChildren(); $("noSteps").hidden = false; $("stepCount").textContent = "";
      $("frames").replaceChildren(el("div", "empty", T.noFrame)); $("caption").textContent = ""; $("live").checked = true;
      if (!op.items.length) $("transcript").append(el("div", "empty", T.noEvents));
      op.items.forEach(putItem); op.steps.forEach(putStep); renderEpisode();
    } else if (op.op === "item") putItem(op.item);
    else if (op.op === "append") appendText(op.id, op.text);
    else if (op.op === "step") putStep(op.step);
    else if (op.op === "episode") { episode = op.episode; renderEpisode(); }
  };
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? res.statusText);
  return data;
}
async function sendMessage() {
  const text = $("msg").value.trim(); if (!text) return;
  if (text.startsWith("/robot-task") && episode?.running && !confirm(T.confirmSwitch)) return;
  try { const r = await post("/message", { text }); $("msg").value = ""; $("msgStatus").textContent = r.steered ? T.steered : T.sent; }
  catch (err) { $("msgStatus").textContent = T.failed(err.message); }
}
async function interrupt() {
  try { await post("/interrupt", {}); $("msgStatus").textContent = T.interrupted; } catch (err) { $("msgStatus").textContent = T.failed(err.message); }
}
$("send").onclick = sendMessage;
$("stop").onclick = interrupt;
$("msg").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  else if (e.key === "Escape") { e.preventDefault(); interrupt(); }
};
$("newTask").onsubmit = async (e) => {
  e.preventDefault();
  if (episode?.running && !confirm(T.confirmSwitch)) return;
  const values = [...$("taskFields").querySelectorAll("input")].map((i) => i.value.trim());
  try { await post("/task", { values }); $("taskStatus").textContent = T.taskSent; }
  catch (err) { $("taskStatus").textContent = T.failed(err.message); }
};
$("expand").onchange = () => { for (const p of document.querySelectorAll("#transcript pre.args")) p.hidden = !$("expand").checked; };
$("live").onchange = () => { if ($("live").checked) { const last = steps.findLast((s) => s && s.frames.length); if (last) select(last.n, false); } };
connect();
</script>
</body>
</html>
